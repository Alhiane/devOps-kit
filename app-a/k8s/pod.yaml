apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a-deployment
  labels:
    app: app-a

spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      initContainers:
        - name: wait-for-database
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z postgressql-db 5432; do echo waiting for database; sleep 2; done;']      
        - name: migrate
          image: app-a-server:latest
          imagePullPolicy: Never
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef:
                name: app-a-config
            - secretRef:
                name: app-a-secret
        - name: seed
          image: app-a-server:latest
          imagePullPolicy: Never
          command: ["php", "artisan", "db:seed", "--force"]
          envFrom:
            - configMapRef:
                name: app-a-config
            - secretRef:
                name: app-a-secret
      containers:
        - name: app-a
          image: app-a-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-a-config
            - secretRef:
                name: app-a-secret
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app-a-service
  labels:
    app: app-a
spec:
  # type: LoadBalancer # NodePort if you want to access it via NodePort # LoadBalancer for cloud environments # ClusterIP for internal access only
  selector:
    app: app-a
  ports:
    - protocol: TCP
      port: 7070
      targetPort: 80
      